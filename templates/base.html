{% load static %}
<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Магазин{% endblock %}</title><link rel="stylesheet" href="{% static 'css/style.css' %}"></head>
<body><header class="site-header"><div class="container header-inner">
<a class="logo" href="{% url 'shop:product_list' %}">Магазин</a>
<nav><a href="{% url 'shop:product_list' %}">Товары</a><a href="{% url 'shop:cart' %}">Корзина ({{ cart_items_count }})</a><a href="/admin/">Админка</a></nav>
</div></header><main class="container">
{% if messages %}{% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}{% endif %}
{% block content %}{% endblock %}</main><footer><div class="container">Учебный интернет-магазин</div></footer></body></html>
